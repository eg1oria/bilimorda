server {
    listen 80;
    listen [::]:80;
    server_name bilimorda.ink www.bilimorda.ink;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 404;
    }
}

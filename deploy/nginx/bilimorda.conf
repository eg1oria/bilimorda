upstream bilimorda_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name bilimorda.ink www.bilimorda.ink;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://bilimorda.ink$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bilimorda.ink;

    ssl_certificate /etc/letsencrypt/live/bilimorda.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilimorda.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BilimordaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://bilimorda.ink$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bilimorda.ink;

    ssl_certificate /etc/letsencrypt/live/bilimorda.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilimorda.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BilimordaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # ADMIN_ROUTE_TOKEN is part of the URL and must not be written to access.log.
    location ^~ /manage/ {
        access_log off;
        proxy_pass http://bilimorda_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    # Next.js owns every public and /api route. NestJS is never exposed directly.
    location / {
        proxy_pass http://bilimorda_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}
